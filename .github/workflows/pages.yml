name: Deploy Jobbies to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Test private companion
        run: |
          npm ci --ignore-scripts --omit=optional
          npm test
      - name: Browser regression checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Refresh technical travel listings
        run: node scripts/refresh-travel-feed.mjs
      - name: Check JavaScript
        run: |
          node --check site/cover-letter.js
          node --check site/matching.js
          node --check site/app.js
          node --check site/question-library.js
          node --check site/answer-policy.js
          node --check site/companion.js
          node --check site/engine.js
          node --check site/workbench.js
      - name: Verify public artifact
        run: python3 scripts/check-public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
